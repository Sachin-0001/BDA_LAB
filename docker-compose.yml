# Single-node Kafka (KRaft, no ZooKeeper) + single-node HDFS.
# Host-facing ports: Kafka 9092, HDFS NameNode UI/WebHDFS 9870, DataNode WebHDFS 9864.
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: lrisk-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  namenode:
    image: apache/hadoop:3.3.6
    container_name: lrisk-namenode
    hostname: namenode
    user: root
    # Format on first start only (the name dir is a persistent volume).
    command: ["sh", "-c", "[ -d /tmp/hadoop-root/dfs/name/current ] || hdfs namenode -format -nonInteractive; exec hdfs namenode"]
    ports:
      - "9870:9870"
    env_file: ./hadoop.env
    volumes:
      - nn-data:/tmp/hadoop-root/dfs/name

  datanode:
    image: apache/hadoop:3.3.6
    container_name: lrisk-datanode
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    ports:
      - "9864:9864"
    env_file: ./hadoop.env
    depends_on:
      - namenode
    volumes:
      - dn-data:/tmp/hadoop-root/dfs/data

volumes:
  kafka-data:
  nn-data:
  dn-data:
